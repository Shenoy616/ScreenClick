<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QA Screen Capture Setup</title>
  <style>
    body {
      margin: 0;
      padding: 28px;
      background: #0f1115;
      color: #e8eaed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 { font-size: 16px; font-weight: 600; margin: 0; }
    p { color: #9aa0a6; line-height: 1.5; margin: 0; font-size: 13px; }
    .status { color: #22c55e; font-family: ui-monospace, monospace; font-size: 12px; }
    .err { color: #ef4444; font-family: ui-monospace, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Setting up screen capture</h1>
  <p>Chrome will ask you to choose a screen or window to capture. This setup window will close automatically when done.</p>
  <div id="status" class="status">Opening picker...</div>
  <script src="launcher.js"></script>
</body>
</html>
