<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScreenClick — Screen or window</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <script src="../shared/theme.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    #picker-spacer {
      flex: 1 1 auto;
      min-height: 520px;
    }
    #after-pick {
      display: none;
      padding: 20px 24px 24px;
      gap: 10px;
      flex-direction: column;
    }
    body.ready #picker-spacer { display: none; min-height: 0; }
    body.ready #after-pick { display: flex; }
    h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    p { color: var(--text-dim); line-height: 1.45; margin: 0; }
    .status {
      color: var(--advantage);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 24px 16px;
    }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <div id="picker-spacer" aria-hidden="true"></div>
  <div id="after-pick">
    <h1>Screen or window capture</h1>
    <p>Keep this window open while you capture. Use ⌘⇧2 / Ctrl+Shift+2 or <strong>Capture</strong> in the side panel.</p>
  </div>
  <div id="status" class="status">Preparing…</div>
  <script>
    globalThis.ScreenClickTheme?.applyStoredTheme();
    globalThis.ScreenClickTheme?.listenThemeChanges();
  </script>
  <script src="../shared/shortcuts.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
