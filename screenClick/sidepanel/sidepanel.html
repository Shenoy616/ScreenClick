<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Uni Capture — Session</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script src="../shared/theme.js"></script>
</head>
<body>
  <header class="panel-header">
    <div class="panel-title-row">
      <img src="../icons/icon-48.png" alt="" class="panel-icon brand-icon">
      <div>
        <h1 class="panel-title">Ready to Capture</h1>
        <p class="panel-sub" id="session-meta"></p>
      </div>
    </div>
    <div class="panel-header-actions">
      <div class="recording-dot hidden" id="recording-badge" role="status" aria-label="Recording" title="Recording"></div>
      <button type="button" id="header-capture-btn" class="header-icon-btn capture-icon-btn hidden" title="Capture screenshot" aria-label="Capture screenshot">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <button id="theme-toggle" class="theme-toggle" type="button" title="Switch to light mode" aria-label="Switch to light mode">
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="capture-feedback" class="capture-feedback hidden" role="status" aria-live="polite">
    <span class="capture-spinner" aria-hidden="true"></span>
    <span id="capture-feedback-text">Capturing screenshot…</span>
  </div>

  <div id="capture-success" class="capture-success hidden" role="status" aria-live="polite">
    Screenshot saved
  </div>

  <main class="panel-main">
    <div id="empty-state" class="empty-state hidden">
      <div id="empty-screenshots" class="empty-variant">
        <div class="empty-illus" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="10" width="30" height="22" rx="4" stroke="currentColor" stroke-width="2" opacity="0.35"/>
            <rect x="12" y="16" width="30" height="22" rx="4" fill="var(--card)" stroke="currentColor" stroke-width="2"/>
            <circle cx="36" cy="22" r="3" fill="currentColor" opacity="0.5"/>
            <path d="M16 32l6-6 4 4 8-10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
          </svg>
        </div>
        <p class="empty-title">No screenshots yet</p>
        <p class="empty-lead">Hit <strong>Start recording</strong> below. Each capture appears here as a thumbnail you can reorder before export.</p>
        <p class="empty-foot">When you're done, use <strong>Stop &amp; Save PDF</strong></p>
      </div>
    </div>

    <div id="target-picker" class="target-picker hidden" aria-label="Choose capture mode">
      <p class="picker-title">Choose what to capture</p>
      <button type="button" class="target-btn" data-target="visible">
        <span class="target-name">Visible Tab</span>
        <span class="target-desc">Screenshot the active tab on click. Use the capture button while recording. Reorder or remove before export.</span>
      </button>
      <button type="button" class="target-btn" data-target="process">
        <span class="target-name">Process Record</span>
        <span class="target-desc">Single-click on elements as numbered Points. Step-by-step PDF guide.</span>
      </button>
      <button type="button" class="target-btn" data-target="screen">
        <span class="target-name">Screen or Window</span>
        <span class="target-desc">Screenshot your monitor or an app window. Use the capture button for each shot · reorder or remove before export.</span>
      </button>
    </div>

    <ol id="step-list" class="step-list hidden" aria-label="Captured screenshots"></ol>
  </main>

  <div id="panel-dock" class="panel-dock hidden" aria-label="Session actions">
    <p id="panel-error" class="panel-error hidden" role="alert"></p>
    <div id="idle-actions" class="panel-actions hidden">
      <button type="button" id="start-btn" class="panel-btn panel-btn-start">Start recording</button>
      <button type="button" id="target-cancel" class="panel-btn panel-btn-ghost hidden">Back</button>
    </div>
    <div id="panel-actions" class="panel-actions hidden">
      <button type="button" id="capture-btn" class="panel-btn panel-btn-capture hidden">Capture screenshot</button>
      <button type="button" id="stop-btn" class="panel-btn panel-btn-stop">Stop &amp; Save PDF</button>
      <button type="button" id="discard-btn" class="panel-btn panel-btn-ghost">Discard session</button>
    </div>
    <div id="filename-panel" class="filename-panel hidden">
      <label for="filename-input" class="filename-label">Filename (without extension)</label>
      <input type="text" id="filename-input" class="filename-input" placeholder="QA-Report">
      <div class="filename-actions">
        <button type="button" id="filename-cancel" class="panel-btn panel-btn-ghost">Cancel</button>
        <button type="button" id="filename-save" class="panel-btn panel-btn-save">Save PDF</button>
      </div>
    </div>
    <p class="panel-dock-hint" id="panel-hint">Reorder or remove screenshots before export</p>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
