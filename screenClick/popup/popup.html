<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScreenClick</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>
        <img src="../icons/icon-48.png" alt="" class="header-icon">
        ScreenClick
      </h1>
    </header>

    <div id="error-banner" class="error-banner hidden"></div>

    <div id="counter-section" class="counter hidden">
      <div class="counter-number" id="counter">0</div>
      <div class="counter-label">screenshots</div>
    </div>

    <div id="mode-indicator" class="mode-indicator hidden">
      <span class="mode-label">Mode</span>
      <span id="mode-value" class="mode-value">Visible Tab</span>
    </div>

    <div class="info-panel" id="info-panel">
      <div class="info-section trigger-section">
        <div class="info-section-title">Active triggers</div>
        <div id="trigger-list" class="trigger-list">Loading...</div>
      </div>
      <div class="info-divider"></div>
      <div class="info-section shortcut-section">
        <div class="shortcut-row">
          <code class="shortcut-chip" data-key="1"></code>
          <span>Start or stop capturing</span>
        </div>
        <div class="shortcut-row">
          <code class="shortcut-chip" data-key="2"></code>
          <span>Save PDF now</span>
        </div>
      </div>
    </div>

    <div id="target-picker" class="target-picker hidden">
      <div class="picker-title">Choose what to capture</div>
      <button class="target-btn" data-target="visible">
        <div class="target-name">Visible Tab</div>
        <div class="target-desc">Current viewport of the active tab. All triggers work.</div>
      </button>
      <button class="target-btn" data-target="process">
        <div class="target-name">Process Record</div>
        <div class="target-desc">Capture every click as a labeled step. Step-by-step PDF guide.</div>
      </button>
      <button class="target-btn" data-target="fullpage">
        <div class="target-name">Full Page</div>
        <div class="target-desc">Scroll and stitch the entire page. Keyboard and timer only.</div>
      </button>
      <button class="target-btn" data-target="screen">
        <div class="target-name">Entire Screen</div>
        <div class="target-desc">Pick a screen or window. Keyboard and timer only.</div>
      </button>
      <button id="target-cancel" class="btn btn-ghost btn-small">Cancel</button>
    </div>

    <div id="filename-section" class="filename-section hidden">
      <label for="filename-input" class="filename-label">Filename (without extension)</label>
      <input type="text" id="filename-input" class="filename-input" placeholder="QA-Report">
      <div class="filename-actions">
        <button id="filename-cancel" class="btn btn-ghost btn-small">Cancel</button>
        <button id="filename-save" class="btn btn-primary btn-small">Save PDF</button>
      </div>
    </div>

    <div class="actions" id="primary-actions">
      <button id="start-btn" class="btn btn-primary">Start Capturing</button>
      <button id="stop-btn" class="btn btn-danger hidden">Stop and Save PDF</button>
      <button id="discard-btn" class="btn btn-ghost hidden">Discard Session</button>
    </div>

    <footer class="footer">
      <a href="#" id="settings-link">Settings</a>
      <div class="footer-right">
        <button id="theme-toggle" class="theme-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
          <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
        <span class="version">v1.4.8</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
